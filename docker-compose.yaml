x-machine-hostnames: &machine-hostnames
  - cka9999
  - ckad9999
  - cks9999
  - kcna9999
  - kcsa9999
  - playground9999
  - other9999

services:
  # VNC Server (Ubuntu)
  remote-desktop:
    image: ckx/ck-x-remote-desktop:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./remote-desktop
    hostname: terminal
    shm_size: 512m # Electron and Firefox share memory through /dev/shm
    expose:
      - "5901" # VNC port (internal only)
      - "6901" # Web VNC port (internal only)
    environment:
      - VNC_PW=bakku-the-wizard
      - VNC_PASSWORD=bakku-the-wizard
      - VNC_VIEW_ONLY=false
      - VNC_RESOLUTION=1280x800
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6901/"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G # VSCodium (Electron) needs the extra headroom
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - ckx-network

  # Web Application (not directly exposed to users)
  webapp:
    image: ckx/ck-x-webapp:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./app
    expose:
      - "3000" # Only exposed to internal network
    environment:
      - VNC_SERVICE_HOST=remote-desktop
      - VNC_SERVICE_PORT=6901
      - VNC_PASSWORD=bakku-the-wizard
      - SSH_HOST=remote-terminal
      - SSH_PORT=22
      - SSH_USER=candidate
      - SSH_PASSWORD=password
      # Multisession: resolve this browser's desktop/terminal from the
      # facilitator by forwarding its session cookie.
      - FACILITATOR_URL=${FACILITATOR_URL:-http://facilitator:3000}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network
      - ckx-sessions

  # Nginx Reverse Proxy - ONLY SERVICE EXPOSED TO USERS
  nginx:
    image: ckx/ck-x-nginx:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./nginx
    depends_on:
      - webapp
      - remote-desktop
      - remote-terminal
      - facilitator
      - k8s-api-server
    ports:
      - "30080:80" # Expose Nginx on port 30080
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ckx-network

  # Jump Host. The name follows the certification (cka9999 for CKA, ckad9999
  # for CKAD, ...); all names below are aliased to the same container so old
  # lab instructions keep resolving.
  jumphost:
    image: ckx/ck-x-jumphost:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./jumphost
    hostname: ${MACHINE_HOSTNAME:-ckad9999}
    privileged: true
    # No external port mappings - only accessible internally
    expose:
      - "22" # SSH port (internal only)
    environment:
      - CLUSTER_NAME=cluster
      - FACILITATOR_URL=${FACILITATOR_URL:-http://facilitator:3000}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
    deploy:
      resources:
        limits:
          cpus: "1"
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      ckx-network:
        aliases: *machine-hostnames
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Remote Terminal Service
  remote-terminal:
    image: ckx/ck-x-remote-terminal:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./remote-terminal
    hostname: remote-terminal
    expose:
      - "22" # SSH port (internal only)
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "22"]
      interval: 10s
      timeout: 5s
      retries: 3

  # KIND Kubernetes Cluster
  k8s-api-server: # Service name that will be used for DNS resolution
    image: ckx/ck-x-k8s-api-server:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./kind-cluster
    container_name: kind-cluster
    hostname: k8s-api-server
    privileged: true # Required for running containers inside KIND
    expose:
      - "6443"
      - "22"
    volumes:
      - kube-config:/home/candidate/.kube # Shared volume for Kubernetes config
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    networks:
      - ckx-network
    healthcheck:
      test: ["CMD", "ls", "/ready"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Redis Database for Facilitator
  redis:
    image: redis:alpine
    hostname: redis
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Facilitator Service
  facilitator:
    image: ckx/ck-x-facilitator:${SESSION_IMAGE_TAG:-dev}
    build:
      context: ./facilitator
      dockerfile: Dockerfile
    hostname: facilitator
    container_name: ckx-facilitator
    # The facilitator talks to the host Docker daemon to provision per-session
    # environments. Running as root is an MVP trade-off for socket permissions;
    # M7 hardening replaces this with a restricted socket proxy.
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=prod
      - SSH_HOST=jumphost
      - SSH_PORT=22
      - SSH_USERNAME=candidate
      - LOG_LEVEL=info
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Multisession (see docs/multisession.md). Flag defaults to false so the
      # current single-environment flow is unchanged.
      - MULTISESSION_ENABLED=${MULTISESSION_ENABLED:-false}
      - MAX_SESSIONS=${MAX_SESSIONS:-3}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - FACILITATOR_URL=${FACILITATOR_URL:-http://facilitator:3000}
      - SESSION_IMAGE_TAG=${SESSION_IMAGE_TAG:-dev}
      - EXAM_DATA_TTL_SECONDS=${EXAM_DATA_TTL_SECONDS:-28800}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-28800}
      - SESSION_IDLE_SECONDS=${SESSION_IDLE_SECONDS:-1800}
      - SESSION_SWEEP_INTERVAL_SECONDS=${SESSION_SWEEP_INTERVAL_SECONDS:-60}
      - SESSION_CONTROL_NETWORK=${SESSION_CONTROL_NETWORK:-ckx-sessions}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - ENV_PROVIDER=${ENV_PROVIDER:-docker-compose}
      - SELF_CONTAINER_NAME=ckx-facilitator
    restart: unless-stopped
    depends_on:
      - jumphost
      - redis
    networks:
      - ckx-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  ckx-network:
    name: ckx-network
    driver: bridge

  # Shared control network: the webapp reaches every session's desktop and
  # terminal here. Session stacks join it as an external network, so no
  # container is attached to another session's network at runtime.
  ckx-sessions:
    name: ckx-sessions
    driver: bridge

volumes:
  kube-config: # Shared volume for Kubernetes configuration
