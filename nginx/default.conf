# Map for WebSocket connections
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  # Docker's embedded DNS. Upstreams are addressed through variables below so
  # nginx re-resolves them instead of pinning the IP it saw at startup.
  # Without this, recreating webapp/facilitator leaves nginx proxying to a
  # stale container IP (which another container may now own).
  resolver 127.0.0.11 valid=10s ipv6=off;
  
  # Disable caching globally
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
  add_header Pragma "no-cache" always;
  add_header Expires "0" always;
  
  # Root location redirects to webapp
  location / {
    set $webapp_upstream http://webapp:3000;
    proxy_pass $webapp_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_no_cache 1;
  }

  # Facilitator API endpoint
  location /facilitator/api/ {
    set $facilitator_upstream http://facilitator:3000;
    rewrite ^/facilitator/api/(.*)$ /api/$1 break;
    proxy_pass $facilitator_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_no_cache 1;
  }

  # VNC WebSocket proxy with improved WebSocket handling
  location /vnc-proxy/ {
    set $webapp_upstream http://webapp:3000;
    proxy_pass $webapp_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_no_cache 1;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  # Direct WebSocket connection to VNC server
  location /websockify {
    set $webapp_upstream http://webapp:3000;
    proxy_pass $webapp_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_no_cache 1;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_buffering off;
  }

  # Health check endpoint
  location /health {
    access_log off;
    return 200 "healthy\n";
  }

  # Error handling
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    set $webapp_upstream http://webapp:3000;
    proxy_pass $webapp_upstream$request_uri;
  }
} 