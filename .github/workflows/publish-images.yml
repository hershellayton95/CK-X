name: Publish images

# Builds every image in docker-compose.yaml and pushes it to GitHub Container
# Registry. Triggered by v* tags and manual runs; GITHUB_TOKEN is enough, no
# repository secrets are needed.
#
# The default platform is linux/amd64. To publish arm64 as well, add
# docker/setup-qemu-action and set platforms: linux/amd64,linux/arm64 below.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}

jobs:
  publish:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ck-x-webapp
            context: ./app
          - image: ck-x-facilitator
            context: ./facilitator
          - image: ck-x-nginx
            context: ./nginx
          - image: ck-x-jumphost
            context: ./jumphost
          - image: ck-x-remote-desktop
            context: ./remote-desktop
          - image: ck-x-remote-terminal
            context: ./remote-terminal
          - image: ck-x-k8s-api-server
            context: ./kind-cluster

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build image (loaded locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Gate the publish on fixable CRITICAL CVEs. Unfixed findings are
      # reported but do not fail the build, since there is nothing to bump to.
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Push
        if: success()
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r tag; do
            if [ -n "$tag" ]; then docker push "$tag"; fi
          done

      - name: Write job summary
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
